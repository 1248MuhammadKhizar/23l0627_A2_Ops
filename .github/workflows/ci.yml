name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 app.py api_server.py src --max-line-length 120 --extend-ignore E501,E702,E401
      - run: docker build -t visionguard:ci .
